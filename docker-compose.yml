services:
  postgres:
    image: postgres:15
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:17.0
    container_name: crm_odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      LIST_DB: "true"
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/custom-addons:/mnt/extra-addons
    ports:
      - "8069:8069"
    networks:
      - crm_network

  n8n:
    image: n8nio/n8n:latest
    container_name: crm_n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      ODOO_DB_NAME: ${ODOO_DB_NAME}
      ODOO_AUTOMATION_UID: ${ODOO_AUTOMATION_UID}
      ODOO_API_KEY: ${ODOO_API_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    ports:
      - "5678:5678"
    networks:
      - crm_network

  ollama:
    image: ollama/ollama:latest
    container_name: crm_ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  postgres_data:
  odoo_data:
  n8n_data:
  ollama_data:
